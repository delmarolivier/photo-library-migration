name: CI

# macOS minutes are the expensive part, so the macos job (and the combined coverage gate that
# needs it) only runs on pull requests. Pushes to main come from squash-merged PRs that
# already passed both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPOTHESIS_PROFILE: ci
  UV_PYTHON: "3.12"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Tests (without macOS-only tests)
        run: uv run pytest -n auto -m "not macos" --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: .coverage.linux
          include-hidden-files: true
          if-no-files-found: error

  no-delete-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if personal data folders are tracked (CLAUDE.md rule 8)
        run: |
          tracked=$(git ls-files -- data data-in takeout Takeout)
          if [ -n "$tracked" ]; then echo "Personal data is tracked:"; echo "$tracked"; exit 1; fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fail if src/ calls any delete or trash API (CLAUDE.md rule 3)
        run: uv run photomigrate-no-delete-check src

  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install exiftool and ffmpeg
        run: brew install exiftool ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests (full suite, including macOS-only tests)
        run: uv run pytest -n auto --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-macos
          path: .coverage.macos
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    if: github.event_name == 'pull_request'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine .coverage.linux .coverage.macos
      - name: Combined coverage gate (90%)
        run: uv run coverage report --fail-under=90
