repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^src/photomigrate/review/static/htmx\.min\.js$  # vendored, byte for byte
      - id: trailing-whitespace
        exclude: ^src/photomigrate/review/static/htmx\.min\.js$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-personal-data
        name: block personal data folders (CLAUDE.md rule 8)
        entry: "Personal data must never be committed. Unstage files under data/, data-in/ or takeout/."
        language: fail
        files: ^(data|data-in|takeout|Takeout)/
      - id: mypy
        name: mypy --strict (src)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-delete-check
        name: no-delete check (CLAUDE.md rule 3)
        entry: uv run photomigrate-no-delete-check src
        language: system
        types: [python]
        pass_filenames: false
