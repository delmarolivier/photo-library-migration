# photomigrate settings, with their built-in defaults.
#
# Copy this file, keep only what you change, and pass it with:
#   photomigrate --config photomigrate.toml analyse
# Unknown settings are errors, so a typo cannot silently fall back to a default.

# Quality flags (photomigrate analyse). A flag is a hint for the review, with a score
# from 0 (just past the threshold) to 1 (as bad as it gets). Nothing is decided here.

[quality.photo]
# Variance of the Laplacian, measured with the long side at most 1024 px.
blurry_below_sharpness = 30.0
low_resolution_below_megapixels = 0.3
# Mean luminance, 0 to 255.
under_exposed_below_brightness = 40.0
over_exposed_above_brightness = 215.0
# Also badly exposed: more than this share of pixels near black (< 16) or near white (> 240).
dark_above_fraction = 0.5
bright_above_fraction = 0.5
# Luminance standard deviation. A flat frame is a pocket shot, a black frame or a lens cap.
accidental_below_contrast = 10.0

[quality.video]
# Live Photo motion halves are never short clips.
short_below_seconds = 1.5
# Mean luminance of 8 frames sampled across the video.
black_below_brightness = 12.0
# Mean change between those frames (0 to 255).
static_below_motion = 2.0
# Pixels on the short side.
tiny_below_short_side = 240

# Best shot (photomigrate analyse). Similar shots are grouped, ranked by a weighted score,
# and the top two of each group are kept; the rest are proposed for "To Delete" and the
# review confirms each group.

[best_shot]
# Every shot in a group is taken within this many seconds of the group's first shot,
window_seconds = 120.0
# and is at least this similar to another shot in it (cosine similarity of open_clip image
# embeddings, from -1 to 1). On the real sample most pairs above 0.94 share their framing;
# lower values also group other compositions of the same event.
min_similarity = 0.94

[best_shot.weights]
# Only the ratios matter. A score that some shot in a group lacks (no faces measured, no
# Apple score for a Google item) is left out for that whole group.
sharpness = 0.3
exposure = 0.15
# Apple Vision face capture quality, and the share of faces with both eyes open (macOS).
faces = 0.2
eyes_open = 0.2
# Apple's overall aesthetic score (iCloud items only).
aesthetic = 0.15

# Clutter (photomigrate analyse): screenshots, receipts and documents, memes, messaging
# forwards and Google creations go to a bulk-review queue, each with a category, a score from
# 0 to 1 and its evidence. Nothing is decided.

[clutter]
# An item joins the queue when its best category scores at least this.
min_score = 0.5

# Location backfill (photomigrate analyse [--timeline Timeline.json]). Proposals only: a
# location is written after the review approves it, with the keyword "location-inferred".

[location]
# A shot without GPS borrows from the same camera's located shots within this many minutes
# (interpolated in time between one before and one after).
window_minutes = 30.0
# With a Timeline export: how far from the moment a path point may be, when no visit covers it.
timeline_tolerance_minutes = 15.0
# Borrow from every camera's shots (two phones at one event); false: the same device's only.
any_device = true

# Import (photomigrate import --apply). Originals are streamed out of the zips, prepared as
# working copies and imported batch by batch; one batch's copies must fit on the disk.

[import]
batch_gigabytes = 20.0
